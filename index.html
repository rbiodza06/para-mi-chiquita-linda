<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff6f7">
  <title>Para ti</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="locked">

  <!-- Dibujos reutilizables: la forma del corazón y la estrellita -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <path id="heart-path" d="M50 85 C20 62 4 46 4 28 C4 14 15 5 28 5 C37 5 45 10 50 18 C55 10 63 5 72 5 C85 5 96 14 96 28 C96 46 80 62 50 85 Z"/>
    </defs>
    <symbol id="sparkle" viewBox="0 0 24 24">
      <path d="M12 0 L14.6 9.4 L24 12 L14.6 14.6 L12 24 L9.4 14.6 L0 12 L9.4 9.4 Z" fill="currentColor"/>
    </symbol>
  </svg>

  <!-- Destellos que se prenden y se apagan (los crea app.js) -->
  <div class="sparkles" id="sparkles" aria-hidden="true"></div>

  <!-- ============ 1. PANTALLA DE DESBLOQUEO (corazón) ============ -->
  <section id="lock-screen" class="lock" aria-label="Pantalla de bienvenida">
    <div class="lock-inner">
      <p class="lock-eyebrow" id="lock-eyebrow"></p>
      <h1 class="title" id="lock-title"></h1>

      <button id="heart-btn" class="heart-btn" type="button" aria-label="Mantén presionado el corazón para entrar">
        <svg class="heart-svg" viewBox="-2 -2 104 94" aria-hidden="true">
          <defs>
            <clipPath id="heart-clip"><use href="#heart-path"/></clipPath>
          </defs>
          <use href="#heart-path" class="heart-bg"/>
          <g clip-path="url(#heart-clip)">
            <rect id="heart-fill" class="heart-fill" x="-2" y="0" width="104" height="100" transform="translate(0 92)"/>
          </g>
          <use href="#heart-path" class="heart-line"/>
        </svg>
      </button>

      <p class="heart-percent" id="heart-percent" aria-hidden="true"></p>
      <p class="lock-hint" id="lock-hint"></p>
    </div>
  </section>

  <!-- ============ CONTENIDO PRINCIPAL ============ -->
  <main id="app" class="app" hidden>

    <header class="hero">
      <h2 class="title big" id="hero-title"></h2>
      <p class="hero-text" id="hero-text"></p>
    </header>

    <!-- ============ 2. GALERÍA DE RECUERDOS ============ -->
    <section id="galeria" class="section">
      <h3 class="section-title">foticos nuestras</h3>
      <p class="section-sub">fotos que representan nuestra relacionnnnnnnn, Toca la fotito para girarla.</p>

      <div class="gallery-wrap">
        <button class="nav-arrow prev" id="gal-prev" type="button" aria-label="Foto anterior">‹</button>
        <div class="gallery" id="gallery-track" tabindex="0" aria-label="Galería de recuerdos"></div>
        <button class="nav-arrow next" id="gal-next" type="button" aria-label="Foto siguiente">›</button>
      </div>
      <div class="dots" id="gallery-dots"></div>
      <p class="counter" id="gallery-counter"></p>
    </section>

    <!-- ============ 3. VIDEO DEL POEMA ============ -->
    <section id="poema" class="section">
      <h3 class="section-title" id="poem-title"></h3>
      <p class="section-sub" id="poem-sub"></p>

      <figure class="video-card">
        <video id="poem-video" controls playsinline preload="metadata"></video>
      </figure>
      <p class="video-msg" id="video-msg" role="status"></p>
      <div class="poem-text" id="poem-text"></div>
    </section>

    <footer class="footer">
      <p id="footer-text"></p>
    </footer>
  </main>

  <!-- Capa donde aparecen las partículas al pulsar botones -->
  <div class="particles" id="particles" aria-hidden="true"></div>

  <!-- Primero la configuración (lo que tú personalizas), luego la lógica -->
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
